# DDOT (Datadog Distribution of the OpenTelemetry Collector) pipeline config.
# Loaded by the embedded collector when DD_OTELCOLLECTOR_ENABLED=true (agent -full image).
# Receives OTLP from EMQX (native OpenTelemetry tracing) on 4317/4318 and exports to
# Datadog. The datadog/connector computes APM trace stats (hits/errors/latency) from the
# incoming spans. DD_API_KEY / DD_SITE are read from the agent container's environment.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}

processors:
  infraattributes:
    cardinality: 2
  batch:
    timeout: 10s

connectors:
  datadog/connector:
    traces:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [infraattributes, batch]
      exporters: [datadog/connector, datadog]
    metrics:
      receivers: [otlp, datadog/connector]
      processors: [infraattributes, batch]
      exporters: [datadog]
    logs:
      receivers: [otlp]
      processors: [infraattributes, batch]
      exporters: [datadog]
