apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: griddog
  labels: { app: emqx }
spec:
  selector: { matchLabels: { app: emqx } }
  template:
    metadata:
      labels: { app: emqx }
      annotations:
        # DATADOG — EMQX integration via the Prometheus/OpenMetrics endpoint + logs.
        # NOTE: the node agent image must include the datadog-emqx integrations-extras
        # check (the base agent does not bundle it) — same requirement as the custom
        # agent image built for docker-compose. mode=all_nodes_aggregated = cluster view.
        ad.datadoghq.com/emqx.checks: |
          {"emqx":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:18083/api/v5/prometheus/stats?mode=all_nodes_aggregated"}]}}
        ad.datadoghq.com/emqx.logs: |
          [{"source":"emqx","service":"emqx"}]
    spec:
      containers:
        - name: emqx
          image: emqx/emqx-enterprise:6.2.2
          env:
            # Stable single-node name (loopback) so mnesia data isn't tied to the pod IP.
            - { name: EMQX_NODE_NAME, value: "emqx@127.0.0.1" }
            # ---- Native OpenTelemetry tracing (k8s parity with docker-compose) ----
            # Exports OTLP/gRPC to the node-local Datadog agent via the host IP (downward
            # API). REQUIRES the DatadogAgent CR to enable OTLP gRPC ingestion (see
            # k8s/datadog-agent.yaml, features.otlp) — the k8s equivalent of compose's
            # DDOT collector. NOTE: not deployed/tested in this session (no cluster up).
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # legacy mode + traceparent-only (see docker-compose.yml + internal/emqx) so
            # EMQX adopts the gateway's injected W3C traceparent -> one merged Datadog trace.
            - { name: EMQX_OPENTELEMETRY__EXPORTER__ENDPOINT, value: '"http://$(HOST_IP):4317"' }
            - { name: EMQX_OPENTELEMETRY__TRACES__ENABLE, value: "true" }
            - { name: EMQX_OPENTELEMETRY__TRACES__FILTER__TRACE_MODE, value: "legacy" }
            - { name: EMQX_OPENTELEMETRY__TRACES__FILTER__TRACE_ALL, value: "false" }
          ports:
            - { containerPort: 1883 }    # MQTT (apps connect here)
            - { containerPort: 18083 }   # dashboard (default login admin/public)
          readinessProbe:
            exec:
              command: ["/opt/emqx/bin/emqx", "ctl", "status"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 25
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata: { name: emqx, namespace: griddog }
spec:
  selector: { app: emqx }
  ports: [{ port: 1883 }]        # only MQTT needed in-cluster
